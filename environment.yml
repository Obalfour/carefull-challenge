name: carefull-challenge
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=1.26
  - pandas=2.2
  - pydantic>=2.7
  - rapidfuzz>=3.9
  - python-dotenv>=1.0
  - altair>=5.4
  - pytest>=8
  - ipykernel
  - pip
  # Installed with pip so conda keeps owning numpy/pandas (mixing both breaks binary packages).
  - pip:
      - google-genai>=1.40
      - vl-convert-python>=1.7
